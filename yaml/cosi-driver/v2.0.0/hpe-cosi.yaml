# Source: hpe-cosi-driver/templates/deployment.yaml
# © Copyright Hewlett Packard Enterprise Development LP
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpe-cosi-provisioner
  namespace: default
  labels:
    helm.sh/chart: hpe-cosi-driver-2.0.0
    app.kubernetes.io/name: hpe-cosi-driver
    app.kubernetes.io/instance: hpe-cosi-driver
    app.kubernetes.io/part-of: "container-object-storage-interface"
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  minReadySeconds: 30
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: hpe-cosi-driver
      app.kubernetes.io/instance: hpe-cosi-driver
      app.kubernetes.io/part-of: "container-object-storage-interface"
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: hpe-cosi-driver
      labels:
        app.kubernetes.io/name: hpe-cosi-driver
        app.kubernetes.io/instance: hpe-cosi-driver
        app.kubernetes.io/part-of: "container-object-storage-interface"
    spec:
      serviceAccountName: hpe-cosi-provisioner-sa
      securityContext:
        runAsNonRoot: true
      volumes:
      - name: socket
        emptyDir: {}
      containers:
        - name: hpe-cosi-driver
          image: quay.io/hpestorage/cosi-driver:v2.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
          - mountPath: /var/lib/cosi
            name: socket
          env:
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: PROXY
            value: ""
          - name: GLCP_COMMON_CLOUD
            value: "global.api.greenlake.hpe.com"
        - name: hpe-cosi-provisioner-sidecar
          image: registry.k8s.io/sig-storage/objectstorage-sidecar:v0.2.2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          args:
          - "--v=5"
          volumeMounts:
          - mountPath: /var/lib/cosi
            name: socket
      tolerations:
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
