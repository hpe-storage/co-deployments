# Source: hpe-cosi-driver/templates/pre-upgrade-hook.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: hpe-cosi-provisioner-pre-upgrade
  namespace: default
  labels:
    helm.sh/chart: hpe-cosi-driver-2.0.0
    app.kubernetes.io/name: hpe-cosi-driver
    app.kubernetes.io/instance: hpe-cosi-driver
    app.kubernetes.io/part-of: "container-object-storage-interface"
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      name: hpe-cosi-provisioner-pre-upgrade
      labels:
        app.kubernetes.io/name: hpe-cosi-driver
        app.kubernetes.io/instance: hpe-cosi-driver
        app.kubernetes.io/part-of: "container-object-storage-interface"
    spec:
      serviceAccountName: hpe-cosi-provisioner-pre-upgrade
      restartPolicy: Never
      containers:
        - name: pre-upgrade
          image: quay.io/hpestorage/cosi-driver:v2.0.0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              APISERVER="https://kubernetes.default.svc"
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              NAMESPACE="default"
              DEPLOYMENT="hpe-cosi-provisioner"
              
              # Function to make HTTP request (tries wget first, then curl)
              http_request() {
                METHOD=$1
                URL=$2
                if command -v wget > /dev/null 2>&1; then
                  wget -q --ca-certificate=${CACERT} \
                    --header="Authorization: Bearer ${TOKEN}" \
                    --method=${METHOD} \
                    -O - "${URL}" 2>/dev/null
                elif command -v curl > /dev/null 2>&1; then
                  curl -s --cacert ${CACERT} \
                    -H "Authorization: Bearer ${TOKEN}" \
                    -X ${METHOD} "${URL}"
                else
                  echo "ERROR: Neither wget nor curl found in image"
                  exit 1
                fi
              }
              
              echo "Checking for existing deployment ${DEPLOYMENT}..."
              if http_request GET "${APISERVER}/apis/apps/v1/namespaces/${NAMESPACE}/deployments/${DEPLOYMENT}" > /dev/null 2>&1; then
                echo "Deleting deployment ${DEPLOYMENT} to handle immutable selector fields..."
                http_request DELETE "${APISERVER}/apis/apps/v1/namespaces/${NAMESPACE}/deployments/${DEPLOYMENT}"
                echo "Deployment deleted successfully"
              else
                echo "Deployment ${DEPLOYMENT} not found, skipping deletion"
              fi
