        - name: plugin-dir
          hostPath:
          
            path: /var/lib/kubelet/plugins/csi.hpe.com
            type: DirectoryOrCreate
        - name: pods-mount-dir
          hostPath:
          
            path: /var/lib/kubelet
        - name: root-dir
          hostPath:
            path: /
        - name: device-dir
          hostPath:
            path: /dev
        - name: log-dir
          hostPath:
            path: /var/log
        - name: etc-hpe-storage-dir
