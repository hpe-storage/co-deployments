# Default values for hpe-csi-driver Helm chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Control CSP Service and Deployments for HPE storage products
disable:
  nimble: false
  primera: false
  alletra6000: false
  alletra9000: false
  alletraStorageMP: false
  b10000FileService: false
  x10000FileService: false

# For controlling automatic iscsi/multipath package installation
disableNodeConformance: false

# For controlling automatic iscsi/multipath service configuration
disableNodeConfiguration: false

# NodeGetVolumestats will be called by default, set true to disable the call
disableNodeGetVolumeStats: false

# The Node Monitor ensure the node has no stale storage resources attached
disableNodeMonitor: false

# The number of volumes the CSI controller will publish to an individual node
maxVolumesPerNode: 250

# Disables host deletion by the CSP when no volumes are associated with the host
disableHostDeletion: false

# Disable pre-install hooks when the chart is rendered outside of Kubernetes, such as CI/CD systems
disablePreInstallHooks: false

# Set to true to generate a unique hash for storage backends that have hostname length limitations
disableHostname: false

# Max hostname length accepted by the storage backend when disableHostname is true
maxHostnameLength: 31

# imagePullPolicy applied for all hpe-csi-driver images
imagePullPolicy: "IfNotPresent"

# Cluster wide values for CHAP authentication
iscsi:
  chapSecretName: ""

# Log level for all hpe-csi-driver components
logLevel: "info"

# Kubelet root directory path
kubeletRootDir: "/var/lib/kubelet"

controller:

  # Number of controller replicas for high availability (active-passive via leader election on
  # csi-provisioner/csi-attacher/csi-snapshotter/csi-resizer). Default 3 for HA; set to 1 to opt
  # back into single-replica behavior.
  replicas: 3

  # Leader election for the CSI controller sidecars (csi-provisioner/csi-attacher/csi-snapshotter/
  # csi-resizer). Automatically active whenever controller.replicas > 1 — there is no supported
  # configuration where multiple replicas run without it, so there is no separate enable/disable
  # flag. Timings are standard client-go leaderelection defaults.
  leaderElection:
    leaseDuration: 15
    renewDeadline: 10
    retryPeriod: 5

  # Leader election Lease timings for hpe-csi-driver's podMonitor loop (always-on, independent of
  # controller.replicas) — gates the loop to a single replica. Standard client-go leaderelection
  # defaults.
  podMonitorLeaderElection:
    leaseDuration: 15
    renewDeadline: 10
    retryPeriod: 2

  # Cross-pod duplicate-request dedup for hpe-csi-driver's controller RPCs (CON-4960-26), used
  # when no --dbserver is configured (the common case). Backed by one Kubernetes Lease per
  # in-flight request key; ttl controls staleness/steal timing, reaperInterval controls how often
  # orphaned stale Leases are garbage-collected. reaperInterval defaults much longer than ttl since
  # the reaper is pure housekeeping, not correctness-critical (see TryAcquire's steal-on-acquire),
  # and every replica runs its own reaper (not leader-elected), so a longer interval also limits
  # redundant List calls.
  distributedDedup:
    ttl: 60
    reaperInterval: 900

  # These values map directly to yaml in the deployment spec, see the kubernetes docs for info
  labels: {}

  # These values map directly to yaml in the deployment spec, see the kubernetes docs for info
  nodeSelector: {}

  # These values map directly to yaml in the deployment spec, see the kubernetes docs for info
  tolerations: []

  affinity: {}

  resources:
    limits:
      cpu: 2000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi

csp:

  # Number of CSP replicas for high availability (active-passive via the primera3par-csp-leader
  # Lease). Default 3 to match the controller; set to 1 to opt back into single-replica behavior.
  replicas: 3

  podDisruptionBudget:
    enabled: true

  # These values map directly to yaml in the deployment spec, see the kubernetes docs for info
  labels: {}

  # These values map directly to yaml in the deployment spec, see the kubernetes docs for info
  nodeSelector: {}

  # These values map directly to yaml in the deployment spec, see the kubernetes docs for info
  tolerations: []

  affinity: {}

  resources:
    limits:
      cpu: 2000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi

  # Leader election Lease timings for the primera3par-csp active-passive leader (always-on,
  # independent of csp.replicas). Standard client-go leaderelection defaults.
  leaderElection:
    leaseDuration: 15
    renewDeadline: 10
    retryPeriod: 2

node:

  # These values map directly to yaml in the deployment spec, see the kubernetes docs for info
  labels: {}

  # These values map directly to yaml in the deployment spec, see the kubernetes docs for info
  nodeSelector: {}

  # These values map directly to yaml in the deployment spec, see the kubernetes docs for info
  tolerations: []

  affinity: {}

  resources:
    limits:
      cpu: 2000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi

# Release images
images:
  csiNodeDriver: quay.io/hpestorage/csi-driver:v3.3.0
  csiControllerDriver: quay.io/hpestorage/csi-driver:v3.3.0
  nimbleCSP: quay.io/hpestorage/alletra-6000-and-nimble-csp:v3.3.0
  primera3parCSP: quay.io/hpestorage/alletra-9000-primera-and-3par-csp:v3.3.0
  b10000FileServiceCSP: quay.io/hpestorage/alletrastoragemp-b10000-nfs-csp:v1.3.0
  x10000FileServiceCSP: quay.io/hpestorage/alletrastoragemp-x10000-nfs-csp:v1.1.0
  nfsProvisioner: quay.io/hpestorage/nfs-provisioner:v3.0.11
  csiExtensions: quay.io/hpestorage/csi-extensions:v1.3.0
  csiVolumeGroupProvisioner: quay.io/hpestorage/volume-group-provisioner:v1.1.0
  csiVolumeGroupSnapshotter: quay.io/hpestorage/volume-group-snapshotter:v1.1.0
  csiVolumeMutator: quay.io/hpestorage/volume-mutator:v1.4.0
  csiAttacher: registry.k8s.io/sig-storage/csi-attacher:v4.12.0
  csiNodeDriverRegistrar: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.17.0
  csiProvisioner: registry.k8s.io/sig-storage/csi-provisioner:v6.3.0
  csiResizer: registry.k8s.io/sig-storage/csi-resizer:v2.2.1
  csiSnapshotter: registry.k8s.io/sig-storage/csi-snapshotter:v8.6.0
