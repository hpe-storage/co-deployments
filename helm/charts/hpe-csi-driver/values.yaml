# Default values for hpe-csi-driver Helm chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Control CSP Service and Deployments for HPE storage products
disable:
  nimble: false
  primera: false
  alletra6000: false
  alletra9000: false
  alletraStorageMP: false
  b10000FileService: false
  x10000FileService: false

# For controlling automatic iscsi/multipath package installation
disableNodeConformance: false

# For controlling automatic iscsi/multipath service configuration
disableNodeConfiguration: false

# NodeGetVolumestats will be called by default, set true to disable the call
disableNodeGetVolumeStats: false

# The Node Monitor ensure the node has no stale storage resources attached
disableNodeMonitor: false

# The number of volumes the CSI controller will publish to an individual node
maxVolumesPerNode: 100

# multipathd unix-domain-socket timeout (uxsock_timeout) in milliseconds written to
# /etc/multipath.conf during node init. Raise on heavily-loaded hosts to avoid
# multipathd command timeouts. Consumed via the MULTIPATH_UXSOCK_TIMEOUT env var.
multipathUxsockTimeout: 300000

# Go runtime tuning for the long-running HPE Go containers (controller, node
# hpe-csi-driver, and CSP). Opt-in: when left at the defaults below, no env var
# is added and rendered manifests are unchanged. See ESC-17696.
#
# goDebug is applied verbatim as the GODEBUG env var. On hosts with Transparent
# Huge Pages set to "always", set "madvdontneed=1" to prevent RSS bloat/OOM.
goDebug: ""
#
# goMemLimitPercent, when > 0, sets GOMEMLIMIT for each container to that
# percentage of the container's resources.limits.memory (e.g. 90). This makes the
# Go GC run harder as it approaches the hard limit. Ignored if no memory limit is
# set on the container. Recommended: 90.
goMemLimitPercent: 0

# Disables host deletion by the CSP when no volumes are associated with the host
disableHostDeletion: false

# Disable pre-install hooks when the chart is rendered outside of Kubernetes, such as CI/CD systems
disablePreInstallHooks: false

# imagePullPolicy applied for all hpe-csi-driver images
imagePullPolicy: "IfNotPresent"

# Cluster wide values for CHAP authentication
iscsi:
  chapSecretName: ""

# Log level for all hpe-csi-driver components
logLevel: "info"

# Kubelet root directory path
kubeletRootDir: "/var/lib/kubelet"

controller:

  # These values map directly to yaml in the deployment spec, see the kubernetes docs for info
  labels: {}

  # These values map directly to yaml in the deployment spec, see the kubernetes docs for info
  nodeSelector: {}

  # These values map directly to yaml in the deployment spec, see the kubernetes docs for info
  tolerations: []

  affinity: {}

  resources:
    limits:
      cpu: 2000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi

csp:

  # These values map directly to yaml in the deployment spec, see the kubernetes docs for info
  labels: {}

  # These values map directly to yaml in the deployment spec, see the kubernetes docs for info
  nodeSelector: {}

  # These values map directly to yaml in the deployment spec, see the kubernetes docs for info
  tolerations: []

  affinity: {}

  resources:
    limits:
      cpu: 2000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi

node:

  # These values map directly to yaml in the deployment spec, see the kubernetes docs for info
  labels: {}

  # These values map directly to yaml in the deployment spec, see the kubernetes docs for info
  nodeSelector: {}

  # These values map directly to yaml in the deployment spec, see the kubernetes docs for info
  tolerations: []

  affinity: {}

  resources:
    limits:
      cpu: 2000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi

# Release images
images:
  csiNodeDriver: quay.io/hpestorage/csi-driver:v3.3.0-alpha2
  csiControllerDriver: quay.io/hpestorage/csi-driver:v3.3.0-alpha2
  nimbleCSP: quay.io/hpestorage/alletra-6000-and-nimble-csp:v3.2.0
  primera3parCSP: quay.io/hpestorage/alletra-9000-primera-and-3par-csp:v3.3.0-alpha2
  b10000FileServiceCSP: quay.io/hpestorage/alletrastoragemp-b10000-nfs-csp:v1.3.0-alpha2
  x10000FileServiceCSP: quay.io/hpestorage/alletrastoragemp-x10000-nfs-csp:v1.1.0-alpha2
  nfsProvisioner: quay.io/hpestorage/nfs-provisioner:v3.0.11-alpha2
  csiExtensions: quay.io/hpestorage/csi-extensions:v1.3.0-alpha2
  csiVolumeGroupProvisioner: quay.io/hpestorage/volume-group-provisioner:v1.1.0-alpha2
  csiVolumeGroupSnapshotter: quay.io/hpestorage/volume-group-snapshotter:v1.1.0-alpha2
  csiVolumeMutator: quay.io/hpestorage/volume-mutator:v1.4.0-alpha2
  csiAttacher: registry.k8s.io/sig-storage/csi-attacher:v4.12.0
  csiNodeDriverRegistrar: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.17.0
  csiProvisioner: registry.k8s.io/sig-storage/csi-provisioner:v6.3.0
  csiResizer: registry.k8s.io/sig-storage/csi-resizer:v2.2.1
  csiSnapshotter: registry.k8s.io/sig-storage/csi-snapshotter:v8.6.0
